name: Collect software download stats
on:
  schedule:
    - cron: '43 1 * * *' # 09:43 Asia/Shanghai; scheduled starts may be delayed.
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/**', 'tests/**', 'products.json', '.github/workflows/download-stats.yml']
permissions:
  contents: write
  pages: write
concurrency:
  group: software-download-stats
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests -v
      - name: Collect all registered software
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/collect.py
      - name: Publish one static feed
        run: |
          git add docs/stats
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'data: update software download snapshots'
          git pull --rebase origin main
          git push origin HEAD:main
      # GITHUB_TOKEN commits don't trigger another workflow/Pages build. Explicitly
      # request a Pages rebuild so the endpoint actually receives today's data.
      - name: Refresh GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST repos/${{ github.repository }}/pages/builds
